<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Activations</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .req-card { background: #1a1a2e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #f39c12; }
        .btn-approve { background: #00f260; color: #000; border:none; padding:10px; cursor:pointer; width:100%; font-weight:bold; border-radius:5px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Pending Requests</h2>
        <div id="list">Loading...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const RATE = 120; // 1 USD = 120 BDT

        db.ref('activation_requests').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
            const list = document.getElementById('list'); 
            list.innerHTML = "";
            if(!snapshot.exists()) { list.innerHTML = "<p>No pending requests.</p>"; return; }
            
            snapshot.forEach((child) => {
                const d = child.val();
                list.innerHTML += `
                <div class="req-card">
                    <p>UID: ${d.uid}</p>
                    <p>TrxID: ${d.trxId}</p>
                    <button class="btn-approve" onclick="approve('${child.key}', '${d.uid}')">APPROVE & DISTRIBUTE</button>
                </div>`;
            });
        });

        async function approve(key, uid) {
            if(!confirm("Approve and Distribute Commission?")) return;

            // 1. Get Commission Settings (Level 1, 2, 3 amounts in USD)
            const settingsSnap = await db.ref('settings/referral_levels').once('value');
            const levelsConfig = settingsSnap.val() || []; // Example: [{level:1, amount:120}, {level:2, amount:60}] (BDT)

            // 2. Get User Info to find Referrer
            const userSnap = await db.ref('users/' + uid).once('value');
            const user = userSnap.val();
            
            if (user.status === 'active') return alert("Already Active!");

            // 3. Recursive Commission Distribution
            if(user.referredBy && user.referredBy !== "the_art2000") {
                await distributeCommission(user.referredBy, 1, levelsConfig, user.ownCode);
            }

            // 4. Activate User
            await db.ref('users/' + uid).update({ 
                status: 'active', 
                activatedAt: firebase.database.ServerValue.TIMESTAMP 
            });
            
            // 5. Update Request Status
            await db.ref('activation_requests/' + key).update({ status: 'approved' });

            alert("Account Activated & Commission Distributed!");
        }

        // --- CORE MLM LOGIC ---
        async function distributeCommission(currentUplineCode, currentLevel, config, sourceUserCode) {
            // Find config for this level (Array index is level-1)
            // config format from settings: [{level:1, amount: 120}, {level:2, amount: 60}] (Saved as BDT)
            const levelSettings = config.find(c => c.level === currentLevel);
            
            // If no settings for this level (e.g. Level 5 reached but only 3 set), STOP.
            if(!levelSettings || levelSettings.amount <= 0) return;

            // Find the Upline User by Code
            const snap = await db.ref('users').orderByChild('ownCode').equalTo(currentUplineCode).once('value');
            
            if(snap.exists()) {
                const uplineUid = Object.keys(snap.val())[0];
                const uplineData = Object.values(snap.val())[0];
                const amountBDT = parseFloat(levelSettings.amount);

                // A. Add Money to Balance
                await db.ref('users/' + uplineUid + '/balance').transaction(bal => (bal || 0) + amountBDT);

                // B. Record History (For My Team Page)
                await db.ref('users/' + uplineUid + '/commission_history').push({
                    fromUser: sourceUserCode, // Who joined?
                    level: currentLevel,      // Which level commission?
                    amount: amountBDT,        // How much BDT?
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                // C. Recurse to Next Upline (Go up the chain)
                if(uplineData.referredBy && uplineData.referredBy !== "the_art2000") {
                    await distributeCommission(uplineData.referredBy, currentLevel + 1, config, sourceUserCode);
                }
            }
        }
    </script>
</body>
</html>
