<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Challenge Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* (Same Admin Theme) */
        :root { --bg: #0f0c29; --card: #1b1b2f; --border: #333; --gold: #f1c40f; --green: #00f260; --blue: #3498db; --purple: #9b59b6; --red: #ff4757; }
        body { margin: 0; padding: 20px; background: var(--bg); color: white; font-family: 'Outfit', sans-serif; }
        .container { max-width: 950px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .back-btn { background: #222; color: #ccc; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 0.9rem; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #222; color: #aaa; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: black; }
        .section { display: none; }
        .section.active { display: block; }
        .form-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #0b0b15; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-save { width: 100%; background: var(--green); color: black; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .level-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .lvl-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; position: relative; border: 1px solid var(--border); }
        .lvl-tag { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .tag-w { background: rgba(52, 152, 219, 0.2); color: var(--blue); }
        .tag-m { background: rgba(155, 89, 182, 0.2); color: var(--purple); }
        .btn-del { background: rgba(255, 71, 87, 0.1); color: var(--red); border: 1px solid var(--red); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-top: 10px; width: 100%; }
        .req-card { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid var(--gold); }
        .btn-grp { display: flex; gap: 10px; margin-top: 10px; }
        .btn-act { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .b-app { background: var(--green); color: black; }
        .b-rej { background: rgba(255, 71, 87, 0.2); color: var(--red); }
        .reward-card { border-left-color: var(--blue); }
        .reward-btn { background: var(--blue); color: white; }
        .empty-msg { text-align: center; color: #666; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><a href="admin_dashboard.html" class="back-btn">Dashboard</a><h2>Weekly & Monthly Manager</h2></div>
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('setup')">Set Targets</button>
            <button class="tab-btn" onclick="showTab('apply_req')">User Requests</button>
            <button class="tab-btn" onclick="showTab('reward_req')">Reward Requests</button>
        </div>

        <!-- 1. SETUP -->
        <div id="setup" class="section active">
            <div class="form-card">
                <h3>Add / Update Level</h3>
                <div class="form-grid">
                    <div><label>Type</label><select id="t_type"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
                    <div><label>Level No</label><input type="number" id="t_lvl" placeholder="Ex: 1"></div>
                    <div><label>Target Refs</label><input type="number" id="t_target" placeholder="Ex: 10"></div>
                    <div><label>Reward ($)</label><input type="number" id="t_reward" placeholder="Ex: 5"></div>
                    <div><label>Cost (Credits)</label><input type="number" id="t_cost" placeholder="Ex: 2"></div>
                    <div><label>Duration (Days)</label><input type="number" id="t_days" placeholder="Ex: 7"></div>
                </div>
                <button class="btn-save" onclick="addLevel()">Save Configuration</button>
            </div>
            <div id="activeLevels" class="level-list"><div class="empty-msg">Loading...</div></div>
        </div>

        <!-- 2. APPLY REQ -->
        <div id="apply_req" class="section"><div id="applyList"><div class="empty-msg">Checking...</div></div></div>

        <!-- 3. REWARD REQ -->
        <div id="reward_req" class="section"><div id="rewardList"><div class="empty-msg">Checking...</div></div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE", authDomain: "shopping28-84906.firebaseapp.com", databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com", projectId: "shopping28-84906", storageBucket: "shopping28-84906.firebasestorage.app", messagingSenderId: "252107906792", appId: "1:252107906792:web:d39b0be25c88e07015b35d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); const RATE = 120;

        function showTab(id) {
            document.querySelectorAll('.section').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active'); event.target.closest('button').classList.add('active');
        }

        // 1. SETUP
        function addLevel() {
            const type = document.getElementById('t_type').value, lvl = document.getElementById('t_lvl').value, target = document.getElementById('t_target').value, reward = document.getElementById('t_reward').value, cost = document.getElementById('t_cost').value, days = document.getElementById('t_days').value;
            if(!lvl) return alert("Fill fields!");
            db.ref(`settings/targets/${type}/${lvl}`).set({ level: Number(lvl), target: Number(target), reward: Number(reward), cost: Number(cost), duration: Number(days), type }).then(() => { alert("Saved!"); document.getElementById('t_lvl').value=""; });
        }
        db.ref('settings/targets').on('value', snap => {
            const container = document.getElementById('activeLevels'); container.innerHTML = "";
            if(!snap.exists()) return container.innerHTML = "<div class='empty-msg'>No levels.</div>";
            const d = snap.val();
            if(d.weekly) Object.values(d.weekly).forEach(l => renderLevelCard(l, container));
            if(d.monthly) Object.values(d.monthly).forEach(l => renderLevelCard(l, container));
        });
        function renderLevelCard(l, p) {
            const cl = l.type === 'weekly' ? 'tag-w' : 'tag-m';
            p.innerHTML += `<div class="lvl-item"><span class="lvl-tag ${cl}">${l.type.toUpperCase()}</span><h3>Lvl ${l.level}</h3><p>🎯 ${l.target} Refs | 💰 $${l.reward} | ⏳ ${l.duration} Days</p><button class="btn-del" onclick="if(confirm('Del?')) db.ref('settings/targets/${l.type}/${l.level}').remove()">Delete</button></div>`;
        }

        // 2. APPLY REQ
        db.ref('target_requests').orderByChild('status').equalTo('pending').on('value', snap => {
            const l = document.getElementById('applyList'); l.innerHTML = "";
            if(!snap.exists()) return l.innerHTML = "<div class='empty-msg'>No applications.</div>";
            snap.forEach(c => {
                const d = c.val();
                l.innerHTML += `<div class="req-card"><p><b>${d.type.toUpperCase()} - Level ${d.level}</b> | UID: ${d.uid}</p><div class="btn-grp"><button class="btn-act b-app" onclick="approveApply('${c.key}','${d.uid}','${d.type}',${d.level},${d.targetCount},${d.reward})">Start</button><button class="btn-act b-rej" onclick="rejectApply('${c.key}','${d.uid}',${d.cost})">Reject</button></div></div>`;
            });
        });
        function approveApply(k, u, t, l, tg, r) {
            if(!confirm("Start?")) return;
            db.ref(`settings/targets/${t}/${l}`).once('value', s => {
                const days = (s.val() && s.val().duration) ? s.val().duration : 30;
                db.ref('users/'+u+'/ownCode').once('value', c => {
                    db.ref('users').orderByChild('referredBy').equalTo(c.val()).once('value', team => {
                        let active = 0; team.forEach(m => { if(m.val().status === 'active') active++; });
                        const end = Date.now() + (days * 86400000);
                        db.ref().update({ ['target_requests/'+k+'/status']: 'approved', ['users/'+u+'/active_target']: { type:t, level:l, targetCount:tg, reward:r, startCount:active, startTime:Date.now(), endTime:end, durationDays:days } }).then(()=>alert("Started!"));
                    });
                });
            });
        }
        function rejectApply(k, u, c) {
            const r = prompt("Reason:"); if(!r) return;
            db.ref('users/'+u+'/credits').once('value', s => {
                db.ref().update({ ['target_requests/'+k+'/status']: 'rejected', ['users/'+u+'/credits']: (s.val()||0)+c, ['users/'+u+'/last_rejection']: r, ['users/'+u+'/rejection_seen']: false }).then(()=>alert("Refunded"));
            });
        }

        // 3. REWARD REQ
        db.ref('reward_requests').orderByChild('status').equalTo('pending').on('value', snap => {
            const l = document.getElementById('rewardList'); l.innerHTML = "";
            if(!snap.exists()) return l.innerHTML = "<div class='empty-msg'>No claims.</div>";
            snap.forEach(c => {
                const d = c.val();
                l.innerHTML += `<div class="req-card reward-card"><p><b>CLAIM $${d.reward}</b> | Level ${d.level} | UID: ${d.uid}</p><div class="btn-grp"><button class="btn-act reward-btn" onclick="payReward('${c.key}','${d.uid}',${d.reward},'${d.type}')">Send Money</button><button class="btn-act b-rej" onclick="if(confirm('Reject?')) db.ref('reward_requests/${c.key}').update({status:'rejected'})">Reject</button></div></div>`;
            });
        });
        function payReward(k, u, a, t) {
            if(!confirm(`Send $${a}?`)) return;
            const bdt = a * RATE;
            db.ref('users/'+u+'/balance').transaction(b => (b||0)+bdt);
            db.ref('users/'+u+'/target_rewards').push({ amount: a, amountBDT: bdt, type: t, timestamp: Date.now() });
            db.ref().update({ ['reward_requests/'+k+'/status']: 'approved', ['users/'+u+'/active_target']: null }).then(()=>alert("Paid!"));
        }
    </script>
</body>
</html>
